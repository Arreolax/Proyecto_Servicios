spring.application.name=prestamos

server.port=8081

# Comunicaci\u00f3n con biblioteca.
biblioteca.url=http://localhost:8080

# Base de datos propia de pr\u00e9stamos.
spring.datasource.url=jdbc:postgresql://localhost:5432/prestamos_soa
spring.datasource.username=prestamos_app
spring.datasource.password=${PRESTAMOS_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.sql.init.mode=never

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

