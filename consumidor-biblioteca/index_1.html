<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Consulta de libros</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f5f7;
            color: #243447;
            margin: 0;
            padding: 24px;
        }

        main {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 28px;
            border-radius: 12px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            margin-bottom: 16px;
            border: 1px solid #aaa;
            border-radius: 4px;
        }

        button {
            padding: 10px 18px;
            background: #174b75;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #resultado {
            margin-top: 20px;
            padding: 16px;
            background: #eef4fa;
        }

        #mensaje {
            min-height: 24px;
            margin-top: 20px;
        }

        .error {
            color: #a01818;
        }

        .exito {
            color: #17633c;
        }
    </style>

    <script src="app.js" defer></script>
</head>

<body>
    <main>
        <h1>Consulta de libros</h1>

        <p>
            Escribe el identificador del libro que deseas consultar.
            Puedes probar con 1, 2 o 3.
        </p>

        <form id="formulario">
            <label for="libroId">Identificador del libro</label>

            <input
                type="number"
                id="libroId"
                min="1"
                max="2147483647"
                step="1"
                required
                placeholder="Ejemplo: 1"
            >

            <button type="submit" id="botonConsultar">
                Consultar
            </button>
        </form>

        <p id="mensaje" role="status" aria-live="polite"></p>

        <section id="resultado" hidden>
            <h2 id="tituloLibro"></h2>

            <p>
                <strong>Identificador:</strong>
                <span id="identificadorLibro"></span>
            </p>

            <p>
                <strong>Autor:</strong>
                <span id="autorLibro"></span>
            </p>

            <p>
                <strong>Disponibilidad:</strong>
                <span id="disponibilidadLibro"></span>
            </p>
        </section>
    </main>
</body>
</html>
